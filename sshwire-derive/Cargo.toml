[package]
name = "sunset-sshwire-derive"
version = "0.3.0"
edition = "2024"
repository = "https://github.com/mkj/sunset"
license = "0BSD"
description = "Derive macros for Sunset SSH packet encoder/decoder"

[lib]
proc-macro = true

[dependencies]
virtue = "=0.0.17" # Last released version

[dev-dependencies]
# Not a workspace dep so it won't have a version number.
# Workaround for circular dev-dependencies.
sunset = { path = "..", features = ["std"]}
